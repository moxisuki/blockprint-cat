project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings.xml
    translation: /app/src/main/res/values-%two_letters_code%/%original_file_name%
    languages_mapping:
      two_letters_code:
        en: en
        en-US: en
        en-GB: en
        en-AU: en
        en-CA: en
        ru: ru
        ru-RU: ru
        ja: ja
        ja-JP: ja
        ko: ko
        ko-KR: ko
        de: de
        de-DE: de
        de-AT: de
        de-CH: de
        fr: fr
        fr-FR: fr
        fr-CA: fr
        es: es
        es-ES: es
        es-MX: es
        es-AR: es
        it: it
        it-IT: it
        nl: nl
        nl-NL: nl
        nl-BE: nl
        pl: pl
        pl-PL: pl
        tr: tr
        tr-TR: tr
        uk: uk
        uk-UA: uk
        vi: vi
        vi-VN: vi
        th: th
        th-TH: th
        id: id
        id-ID: id
        ar: ar
        ar-SA: ar
        ar-EG: ar
        pt-BR: pt-rBR
        pt-PT: pt-rPT
        zh-CN: zh-rCN
        zh-TW: zh-rTW
        zh-HK: zh-rHK
